        const questions = qData.map(item => ({ q: item.q, options: item.o, ans: item.a }));

        const quizContainer = document.getElementById('quizContainer');
        const startSelect = document.getElementById('startSelect');
        const rateSlider = document.getElementById('speechRate');
        const rateDisplay = document.getElementById('rateDisplay');
        const synth = window.speechSynthesis;
        let isSequentialReading = false;
        let currentSequenceIndex = 0;

        // Initialize App
        function initApp() {
            renderQuestions();
            populateSelect();

            // Update pace display on slider change
            rateSlider.addEventListener('input', function () {
                rateDisplay.textContent = this.value + 'x';
            });
        }

        // Render Questions HTML efficiently using Document Fragment
        function renderQuestions() {
            quizContainer.innerHTML = '';
            const fragment = document.createDocumentFragment();

            questions.forEach((q, index) => {
                const labels = ['A', 'B', 'C', 'D'];
                let optionsHtml = '';

                q.options.forEach((opt, optIdx) => {
                    optionsHtml += `
                        <label id="label-${index}-${optIdx}" class="flex items-center p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-50 transition">
                            <input type="radio" name="q${index}" value="${optIdx}" class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                            <span class="ml-3 font-medium text-slate-700">${labels[optIdx]}.</span>
                            <span class="ml-2 text-slate-600">${opt}</span>
                        </label>
                    `;
                });

                const cardHtml = `
                    <div id="questionCard-${index}" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition-all duration-300">
                        <div class="flex items-start justify-between mb-4">
                            <h3 class="text-lg font-semibold text-slate-800"><span class="text-blue-600 mr-1">Q${index + 1}.</span> ${q.q}</h3>
                        </div>
                        <div class="space-y-2 mb-6">
                            ${optionsHtml}
                        </div>
                        <div class="flex flex-wrap gap-3 border-t border-slate-100 pt-4">
                            <button onclick="showHint(${index})" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                                <i class="fas fa-lightbulb"></i> Hint / Show Answer
                            </button>
                            <button onclick="readSingleQuestion(${index})" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                                <i class="fas fa-volume-up"></i> Read Out Loud
                            </button>
                        </div>
                    </div>
                `;

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = cardHtml;
                fragment.appendChild(tempDiv.firstElementChild);
            });

            quizContainer.appendChild(fragment);
        }

        // Populate Select Dropdown
        function populateSelect() {
            const fragment = document.createDocumentFragment();
            questions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Q${index + 1}`;
                fragment.appendChild(option);
            });
            startSelect.appendChild(fragment);
        }

        // Show Hint (Highlight correct answer)
        function showHint(qIndex) {
            const correctOptIdx = questions[qIndex].ans;
            const targetLabel = document.getElementById(`label-${qIndex}-${correctOptIdx}`);

            // Remove previous highlights in this question
            for (let i = 0; i < 4; i++) {
                const lbl = document.getElementById(`label-${qIndex}-${i}`);
                if (lbl) lbl.classList.remove('correct-highlight');
            }

            // Add highlight and check radio button
            if (targetLabel) {
                targetLabel.classList.add('correct-highlight');
                const radio = targetLabel.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
            }
        }

        // Clear all reading visual highlights
        function clearReadingHighlights() {
            const activeCards = document.querySelectorAll('.reading-active');
            activeCards.forEach(card => card.classList.remove('reading-active'));
        }

        // Core Speech Function
        function speakText(text, onEndCallback = null) {
            if (synth.speaking) synth.cancel(); // Stop current speech

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = parseFloat(rateSlider.value); // Use value from slider

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            synth.speak(utterance);
        }

        // Read Single Question & Answer
        function readSingleQuestion(index) {
            stopReading(); // Stop sequential if running
            clearReadingHighlights();

            const card = document.getElementById(`questionCard-${index}`);
            card.classList.add('reading-active');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const qText = "Question " + (index + 1) + ". " + questions[index].q;
            const correctIdx = questions[index].ans;
            const ansText = "Answer. " + questions[index].options[correctIdx];

            // Speak Question, then Answer
            speakText(qText, () => {
                // Short pause, show hint, then read answer
                setTimeout(() => {
                    showHint(index);
                    speakText(ansText, () => {
                        card.classList.remove('reading-active');
                    });
                }, 500);
            });
        }

        // Start Sequential Reading
        function startSequentialReading() {
            const startIndex = parseInt(startSelect.value);
            isSequentialReading = true;
            currentSequenceIndex = startIndex;

            document.getElementById('startReadingBtn').classList.add('hidden');
            document.getElementById('stopReadingBtn').classList.remove('hidden');

            processSequence();
        }

        // Process loop for sequential reading
        function processSequence() {
            if (!isSequentialReading || currentSequenceIndex >= questions.length) {
                stopReading();
                return;
            }

            clearReadingHighlights();
            const index = currentSequenceIndex;
            const card = document.getElementById(`questionCard-${index}`);
            card.classList.add('reading-active');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const qText = "Question " + (index + 1) + ". " + questions[index].q;
            const correctIdx = questions[index].ans;
            const ansText = "Answer. " + questions[index].options[correctIdx];

            speakText(qText, () => {
                if (!isSequentialReading) return;

                setTimeout(() => {
                    if (!isSequentialReading) return;
                    showHint(index);

                    speakText(ansText, () => {
                        if (!isSequentialReading) return;
                        card.classList.remove('reading-active');
                        currentSequenceIndex++;

                        // Update the dropdown to match the current reading index
                        if (currentSequenceIndex < questions.length) {
                            startSelect.value = currentSequenceIndex;
                        }

                        // 1.5 second pause between questions
                        setTimeout(() => {
                            if (isSequentialReading) processSequence();
                        }, 1500);
                    });
                }, 600); // Pause before reading answer
            });
        }

        // Stop all reading
        function stopReading() {
            isSequentialReading = false;
            synth.cancel();
            clearReadingHighlights();

            document.getElementById('startReadingBtn').classList.remove('hidden');
            document.getElementById('stopReadingBtn').classList.add('hidden');
        }

        // Stop speech if user leaves page
        window.addEventListener('beforeunload', () => {
            if (synth) synth.cancel();
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>

</html>
