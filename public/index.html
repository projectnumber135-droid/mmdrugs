<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remedy Search & Combine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --primary-color: #4CAF50;
            --secondary-bg: #2d2d2d;
            --border-color: #444;
            --hover-bg: #3d3d3d;
            --accent-color: #66bb6a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Search Bar */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-bar svg {
            fill: #aaa;
            width: 20px;
            height: 20px;
        }

        .image-filter-btn {
            font-size: 20px;
            cursor: pointer;
            margin-right: 12px;
            user-select: none;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
        }

        .image-filter-btn:hover {
            transform: scale(1.2);
        }

        #search-results {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .result-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .result-item:hover {
            background-color: var(--hover-bg);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item.has-image {
            color: var(--accent-color);
            background-color: rgba(102, 187, 106, 0.05);
            font-weight: 500;
        }

        .has-image-icon {
            float: right;
            font-size: 16px;
        }

        /* Alphabet Buttons */
        .alphabet-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .alpha-btn {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .alpha-btn:hover,
        .alpha-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Name Heading */
        .remedy-name {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            min-height: 34px;
        }

        /* Source Boxes */
        .sources-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .source-box {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: none;
            /* Hidden until a remedy is selected */
        }

        .source-header {
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid transparent;
            cursor: pointer;
            user-select: none;
        }

        .source-box.expanded .source-header {
            border-bottom-color: var(--border-color);
        }

        .header-checkbox {
            margin-right: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .source-title {
            flex: 1;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .expand-icon {
            transition: transform 0.3s;
        }

        .source-box.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .source-content {
            padding: 0 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
        }

        .source-box.expanded .source-content {
            padding: 15px;
            max-height: 2000px;
        }

        .section-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding-left: 20px;
        }

        .section-item:last-child {
            margin-bottom: 0;
        }

        .section-checkbox {
            margin-right: 10px;
            cursor: pointer;
        }

        .section-label {
            cursor: pointer;
            text-transform: capitalize;
        }

        /* Combine Button */
        button.combine-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 20px auto;
            display: block;
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 200px;
        }

        button.combine-btn:hover {
            background: #43a047;
        }

        /* Request Button */
        button.request-btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px auto;
            display: inline-block;
        }

        button.request-btn:hover {
            background: #e67e22;
        }

        button.request-btn:disabled {
            background: #555;
            cursor: not-allowed;
            color: #aaa;
        }

        .admin-upload-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 11px 16px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
        }

        .admin-upload-btn:hover {
            background: #2c3e50;
        }

        .admin-upload-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .admin-delete-img-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            z-index: 10;
        }

        .admin-delete-img-btn:hover {
            background: rgba(192, 57, 43, 1);
            transform: scale(1.05);
        }

        .admin-delete-img-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .img-download-btn {
            position: absolute;
            bottom: 60px;
            right: 15px;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            z-index: 10;
        }

        .img-download-btn:hover {
            background: rgba(39, 174, 96, 1);
            transform: scale(1.05);
        }

        .img-loading-text {
            color: #aaa;
            font-style: italic;
            padding: 20px;
        }

        /* Result Area */
        .result-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-container label {
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea.result-text {
            width: 100%;
            height: 300px;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 15px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        textarea.result-text:focus {
            border-color: var(--primary-color);
        }

        .ai-buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .ai-prompt-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ai-prompt-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .ai-prompt-btn:active {
            transform: translateY(0);
        }

        .btn-gemini {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
        }

        .btn-gemini:hover {
            background: linear-gradient(135deg, #1765cc, #3b71db);
        }

        .btn-notebooklm {
            background: linear-gradient(135deg, #34a853, #43a047);
        }

        .btn-notebooklm:hover {
            background: linear-gradient(135deg, #2d9248, #3e8e41);
        }

        .ai-btn-icon {
            font-size: 18px;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 26, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
        }

        /* Fullscreen Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .image-modal img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .image-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }

        .image-modal .close-btn:hover {
            color: var(--primary-color);
        }

        #login-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }

        .google-btn {
            background-color: white;
            color: #757575;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
            margin-top: 20px;
        }

        .google-btn:hover {
            background-color: #f1f1f1;
        }

        .logout-container {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .logout-btn {
            background: transparent;
            color: #ff5252;
            border: 1px solid #ff5252;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #ff5252;
            color: white;
        }

        #admin-link {
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        #admin-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* Requests View Styles */
        .request-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .request-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-remedy-name {
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
        }

        .request-date {
            color: #aaa;
            font-size: 14px;
        }

        .admin-loading {
            text-align: center;
            font-size: 18px;
            padding: 40px;
            color: #aaa;
            font-style: italic;
        }

        .no-data {
            text-align: center;
            font-size: 18px;
            padding: 40px;
            background: var(--secondary-bg);
            border-radius: 8px;
        }

        .copy-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #2980b9;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 15px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 10px;
            transition: color 0.2s;
            cursor: pointer;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div id="login-container">
        <h1>Remedy Search</h1>
        <p>Please log in to continue.</p>
        <button class="google-btn" onclick="signInWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" width="18"
                height="18">
            Sign in with Google
        </button>
    </div>

    <div class="container" id="app-container" style="display: none;">

        <!-- Main Search View -->
        <div id="search-view" class="view-container">
            <!-- Search area -->
            <div class="search-container">
                <div class="search-bar">
                    <div id="imageFilterBtn" class="image-filter-btn" title="Show only remedies with images">🖼️</div>
                    <input type="text" id="searchInput" placeholder="Search remedy..." autocomplete="off">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                </div>
                <button id="mergeBtn" class="combine-btn"
                    style="display: none; background: #9b59b6; margin: 5px 0; padding: 10px; font-size: 15px;"
                    onclick="performMerge()">Merge Selected</button>
                <div id="search-results" style="top: 100px;"></div>

                <div class="alphabet-container" id="alphabet-container">
                    <!-- A-Z buttons will be injected here -->
                    <div class="alpha-btn">A</div>
                    <div class="alpha-btn">B</div>
                    <div class="alpha-btn">C</div>
                    <div class="alpha-btn">D</div>
                    <div class="alpha-btn">E</div>
                    <div class="alpha-btn">F</div>
                    <div class="alpha-btn">G</div>
                    <div class="alpha-btn">H</div>
                    <div class="alpha-btn">I</div>
                    <div class="alpha-btn">J</div>
                    <div class="alpha-btn">K</div>
                    <div class="alpha-btn">L</div>
                    <div class="alpha-btn">M</div>
                    <div class="alpha-btn">N</div>
                    <div class="alpha-btn">O</div>
                    <div class="alpha-btn">P</div>
                    <div class="alpha-btn">Q</div>
                    <div class="alpha-btn">R</div>
                    <div class="alpha-btn">S</div>
                    <div class="alpha-btn">T</div>
                    <div class="alpha-btn">U</div>
                    <div class="alpha-btn">V</div>
                    <div class="alpha-btn">W</div>
                    <div class="alpha-btn">X</div>
                    <div class="alpha-btn">Y</div>
                    <div class="alpha-btn">Z</div>
                </div>
            </div>

            <div class="remedy-name" id="remedy-name">Select a Remedy</div>

            <div id="remedy-image-area" style="display: none; text-align: center; margin-bottom: 20px;">
                <!-- Loading Indicator -->
                <div id="image-loading" class="img-loading-text" style="display: none;">Loading Image...</div>

                <!-- Result Image Wrapper to position delete button -->
                <div style="position: relative; display: inline-block;">
                    <img id="remedy-image" src="" alt="Remedy Image"
                        style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; display: none;"
                        onclick="openFullscreenImage()">
                    <button id="imgDownloadBtn" class="img-download-btn" style="display: none;"
                        title="Download Original Image"
                        onclick="event.stopPropagation(); downloadOriginalImage()">📥</button>
                    <button id="adminDeleteImgBtn" class="admin-delete-img-btn" style="display: none;"
                        title="Delete Image (Admin Only)"
                        onclick="event.stopPropagation(); handleAdminImageDelete()">🗑️</button>
                </div>
            </div>

            <div id="request-map-area" style="display: none; text-align: center; margin-bottom: 20px;">
                <button id="requestBtn" class="request-btn" onclick="requestMindMap()"
                    style="vertical-align: middle;">Request Mind Map</button>
                <input type="file" id="adminImageUpload" accept="image/*" style="display: none;"
                    onchange="handleAdminImageUpload(event)">
                <button id="adminUploadBtn" class="admin-upload-btn" title="Upload Image (Admin Only)"
                    onclick="document.getElementById('adminImageUpload').click()" style="display: none;">📤</button>
            </div>

            <div class="sources-container" id="sources-container">

                <!-- Allens -->
                <div class="source-box" id="box-allens">
                    <div class="source-header" onclick="toggleSource('allens')">
                        <input type="checkbox" class="header-checkbox" id="check-allens"
                            onclick="event.stopPropagation(); toggleAllSections('allens', this.checked)">
                        <div class="source-title">ALLENS</div>
                        <svg class="expand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0"
                            stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="source-content" id="content-allens">
                        <!-- Checkboxes injected here -->
                    </div>
                </div>

                <!-- Gems -->
                <div class="source-box" id="box-gems">
                    <div class="source-header" onclick="toggleSource('gems')">
                        <input type="checkbox" class="header-checkbox" id="check-gems"
                            onclick="event.stopPropagation(); toggleAllSections('gems', this.checked)">
                        <div class="source-title">GEMS</div>
                        <svg class="expand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0"
                            stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="source-content" id="content-gems">
                        <!-- Checkboxes injected here -->
                    </div>
                </div>

                <!-- Boericke -->
                <div class="source-box" id="box-boericke">
                    <div class="source-header" onclick="toggleSource('boericke')">
                        <input type="checkbox" class="header-checkbox" id="check-boericke"
                            onclick="event.stopPropagation(); toggleAllSections('boericke', this.checked)">
                        <div class="source-title">BOERICKE</div>
                        <svg class="expand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e0e0e0"
                            stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="source-content" id="content-boericke">
                        <!-- Checkboxes injected here -->
                    </div>
                </div>

            </div>

            <button class="combine-btn" id="combineBtn" onclick="combineData()">Combine</button>

            <div class="result-container">
                <label>RESULT IN TEXT</label>
                <textarea class="result-text" id="resultText"
                    placeholder="Combined paragraphs will appear here..."></textarea>
            </div>

            <div class="ai-buttons-container" id="aiButtons" style="display: none;">
                <button id="geminiBtn" class="ai-prompt-btn btn-gemini" onclick="copyGeminiPrompt()">
                    <span class="ai-btn-icon">✦</span> Gemini
                </button>
                <button id="notebooklmBtn" class="ai-prompt-btn btn-notebooklm" onclick="copyNotebookLMPrompt()">
                    <span class="ai-btn-icon">📒</span> NotebookLM
                </button>
            </div>
        </div>

        <!-- Requests Admin View -->
        <div id="request-view" class="view-container" style="display: none;">
            <a href="#" class="back-link">← Back to Search</a>
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px;">
                <h1
                    style="border-bottom: none; padding-bottom: 0; margin: 0; font-size: 24px; color: #f39c12; letter-spacing: 1px;">
                    Mind Map Requests</h1>
                <div id="actionBtns" style="display: none;">
                    <button id="clearAllBtn" class="clear-btn" onclick="clearAllRequests()">Clear All</button>
                    <button id="copyAllBtn" class="copy-btn" onclick="copyAllRequests()">Copy All</button>
                </div>
            </div>
            <div id="admin-loading" class="admin-loading">Loading requests...</div>
            <div id="requestList" class="request-list" style="display: none; flex-direction: column;">
                <!-- Requests will be injected here -->
            </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEGgnLQy0dfHRGlaLnpvWP0-LFsI7zM4E",
            authDomain: "mmdrugs.firebaseapp.com",

            storageBucket: "mmdrugs.firebasestorage.app",
            messagingSenderId: "74640700507",

            measurementId: "G-JSLWNK875Z"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const firestore = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        window.userEmail = null;
        window.isWhitelisted = false;

        function signInWithGoogle() {

                console.error("Login failed:", err);
                alert("Login failed: " + err.message);
            });

        function signOut() {
            auth.signOut().then(() => {
                window.location.reload();
            });
        }

        auth.onAuthStateChanged(async user => {
            const loginContainer = document.getElementById('login-container');
            const loading = document.getElementById('loading');
            const app = document.getElementById('app-container');

            if (user) {
                // Logged in
                window.userEmail = user.email ? user.email.toLowerCase().trim() : "";

                loginContainer.style.display = 'none';
                loading.style.display = 'flex';
                loading.innerText = 'Verifying Admin Privileges...';

                try {
                    // Fetch whitelist from Firestore auth/admin/email
                    const emailDoc = await firestore.doc('auth/admin').get();
                    if (emailDoc.exists) {
                        const emails = emailDoc.data().email;
                        window.isWhitelisted = emails.includes(window.userEmail);
                    }
                } catch (e) {
                    console.error("Error verifying admin whitelist:", e);
                }

                if (window.isWhitelisted) {
                    document.getElementById('admin-link').style.display = 'block';
                    const aiButtons = document.getElementById('aiButtons');
                    if (aiButtons) aiButtons.style.display = 'flex';
                }

                loading.innerText = 'Loading Databases... Please wait.';

                // Now load data
                if (typeof loadData === 'function') {
                    loadData();
                } else {
                    console.error('loadData function not found in main.js');

            } else {
                // Not logged in
                loading.style.display = 'none';
                app.style.display = 'none';
                loginContainer.style.display = 'flex';

        });
    </script>
    <script>
        // ─────────────────────────────────────────────────────────────────────────────
        // Remedy Search, Detail Sections, and Combine
        // ─────────────────────────────────────────────────────────────────────────────

        let remedyData = [];   // [{name, sources:{A,G,B}}]
        let allensBook = null; // Map: normalisedName → remedyObj
        let gemsBook = null;
        let boerickeBook = null;
        let currentSources = {}; // sources for currently selected remedy
        const preloadedImages = new Set(); // track preloaded thumb URLs
        let allRequestsList = []; // store for admin view

        // ── Remedy Key Helper for Firebase ──────────────────────────────────────────
        function remedyToKey(name) {
            if (!name) return "";
            const norm = name.trim().toUpperCase();
            const utf8Bytes = new TextEncoder().encode(norm);
            let binary = '';
            utf8Bytes.forEach(b => binary += String.fromCharCode(b));
            return btoa(binary)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        // ── Bootstrap ────────────────────────────────────────────────────────────────
        async function loadData() {
            try {
                // Fetch books from CDN and image mapping from Firebase Realtime Database in parallel
                const [data, imgSnapshot] = await Promise.all([
                    fetch(`https://raw.githubusercontent.com/projectnumber135-droid/mmdrugs/refs/heads/main/data.json?_t=${Date.now()}`).then(r => r.json()),
                    database.ref('images').once('value')
                ]);

                allensBook = buildLookup(data.allens_data.remedies, 'name');
                gemsBook = buildLookup(data.gems_data.remedies, 'name');
                boerickeBook = buildLookup(data.boericke_data.remedies, 'name');

                const imagesMap = new Map();
                if (imgSnapshot.exists()) {
                    imgSnapshot.forEach(child => {
                        const val = child.val();
                        if (typeof val === 'string') {
                            imagesMap.set(child.key, val);
                        } else if (val && val.file) {
                            imagesMap.set(child.key, val.file);
                            if (val.name) {
                                imagesMap.set(val.name.trim().toUpperCase(), val.file);
                            }
                        }
                    });
                }

                remedyData = data.index.map(entry => {
                    const [name, sources] = Object.entries(entry)[0];
                    const rObj = { name, sources: sources || {} };
                    const k = remedyToKey(name);
                    const mappedImg = imagesMap.get(k) || imagesMap.get(name.trim().toUpperCase());
                    if (mappedImg) {
                        rObj.sources.I = mappedImg;
                    }
                    return rObj;
                }).filter(r => typeof r.name === 'string');

                initAlphabetButtons();
                initSearch();

                // Handle initial routing
                handleRouting();

                // Reveal App UI
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
            } catch (err) {
                console.error('Boot error:', err);
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.innerText = 'Initialization Error. Please check your connection.';
                    loading.style.color = '#ff5252';
                }
            }
        }

        // Build a case-insensitive lookup map
        function buildLookup(arr, key) {
            const map = new Map();
            if (!Array.isArray(arr)) return map;
            arr.forEach(r => { if (r[key]) map.set(r[key].toLowerCase().trim(), r); });
            return map;
        }
        function lookupRemedy(map, name) {
            if (!name || !map) return null;
            return map.get(name.toLowerCase().trim()) || null;
        }

        // ── Alphabet buttons ──────────────────────────────────────────────────────────
        function initAlphabetButtons() {
            const container = document.getElementById('alphabet-container');
            container.innerHTML = '';
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
                const btn = document.createElement('div');
                btn.className = 'alpha-btn';
                btn.textContent = letter;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('searchInput').value = '';
                    hideResults();
                    filterByLetter(letter);
                });
                container.appendChild(btn);
            });
        }

        function filterByLetter(letter) {
            const results = remedyData.filter(r => r.name.toLowerCase().startsWith(letter.toLowerCase()));
            displayResults(results, '');
        }

        // ── Search ────────────────────────────────────────────────────────────────────
        function initSearch() {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', e => {
                const q = e.target.value.toLowerCase().trim();
                document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                if (!q) { hideResults(); return; }
                const results = remedyData
                    .filter(r => r.name.toLowerCase().includes(q))
                    .sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q));
                displayResults(results, q);
            });
            document.addEventListener('click', e => {
                if (!e.target.closest('.search-container')) hideResults();
            });
            input.addEventListener('focus', () => {
                const q = input.value.trim().toLowerCase();
                if (!q) return;
                const results = remedyData
                    .filter(r => r.name.toLowerCase().includes(q))
                    .sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q));
                displayResults(results, q);
            });

            const imgFilterBtn = document.getElementById('imageFilterBtn');
            if (imgFilterBtn) {
                imgFilterBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                    input.value = ''; // Clear search input when showing images
                    const results = remedyData.filter(r => r.sources && r.sources.I);
                    displayResults(results, '');
                });
            }
        }

        // ── Highlight helper ──────────────────────────────────────────────────────────
        function highlightMatch(text, query) {
            if (!query) return document.createTextNode(text);
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return document.createTextNode(text);
            const wrap = document.createElement('span');
            wrap.appendChild(document.createTextNode(text.slice(0, idx)));
            const mark = document.createElement('mark');
            mark.style.cssText = 'background:#4CAF50;color:#fff;border-radius:2px;padding:0 2px;';
            mark.textContent = text.slice(idx, idx + query.length);
            wrap.appendChild(mark);
            wrap.appendChild(document.createTextNode(text.slice(idx + query.length)));
            return wrap;
        }

        // ── Source badges ─────────────────────────────────────────────────────────────
        const SOURCE_COLORS = { A: '#2196F3', G: '#9C27B0', B: '#FF9800' };

        function buildBadges(sources) {
            const wrap = document.createElement('span');
            wrap.style.cssText = 'display:flex;gap:4px;margin-left:10px;flex-shrink:0;align-items:center;';
            ['A', 'G', 'B'].forEach(key => {
                if (!sources[key]) return;
                const badge = document.createElement('span');
                badge.textContent = key;
                badge.style.cssText = `background:${SOURCE_COLORS[key]};color:#fff;border-radius:3px;padding:1px 5px;font-size:11px;font-weight:700;letter-spacing:0.5px;line-height:1.6;`;
                wrap.appendChild(badge);
            });
            if (sources['I']) {
                const icon = document.createElement('span');
                icon.textContent = '🖼️'; // Picture icon
                icon.style.cssText = 'font-size:14px; margin-left:4px;';
                wrap.appendChild(icon);
            }
            return wrap;
        }

        // ── Display result dropdown ───────────────────────────────────────────────────
        function displayResults(results, query) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            if (results.length === 0) {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.textContent = 'No remedies found.';
                container.appendChild(div);
            } else {
                results.forEach(({ name, sources }) => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    if (sources['I']) {
                        div.classList.add('has-image');
                    }
                    div.style.cssText = 'display:flex;align-items:center;justify-content:space-between;cursor:pointer;';
                    const nameSpan = document.createElement('span');
                    nameSpan.appendChild(highlightMatch(name, query));
                    div.appendChild(nameSpan);
                    div.appendChild(buildBadges(sources || {}));
                    div.addEventListener('click', () => {
                        document.getElementById('searchInput').value = name;
                        hideResults();
                        selectRemedy(name, sources || {});
                    });

                    // Preload when hovering results to make selection feel instant
                    div.addEventListener('mouseenter', () => {
                        if (sources['I'] && !preloadedImages.has(sources['I'])) {
                            const fullSrc = 'https://raw.githubusercontent.com/projectnumber135-droid/mmdrugs/refs/heads/main/images/' + sources['I'];
                            const thumbSrc = `https://images.weserv.nl/?url=${encodeURIComponent(fullSrc)}&w=300&output=webp&q=50`;
                            const preloader = new Image();
                            preloader.src = thumbSrc;
                            preloadedImages.add(sources['I']);
                        }
                    });

                    container.appendChild(div);
                });
            }
            container.style.display = 'block';
        }

        function hideResults() {
            const el = document.getElementById('search-results');
            if (el) el.style.display = 'none';
        }

        // ── Select a remedy → populate section accordions ────────────────────────────
        function selectRemedy(name, sources) {
            currentSources = sources;

            // Update heading
            const heading = document.getElementById('remedy-name');
            if (heading) heading.textContent = name.toUpperCase();

            // Clear output
            const resultText = document.getElementById('resultText');
            if (resultText) resultText.value = '';

            // ── Image display ──────────────────────────────────────────────────────
            const imgArea = document.getElementById('remedy-image-area');
            const imgEl = document.getElementById('remedy-image');
            const imgLoad = document.getElementById('image-loading');
            const adminDelBtn = document.getElementById('adminDeleteImgBtn');

            if (sources['I'] && imgArea && imgEl) {
                // Full resolution URL
                const fullSrc = 'https://raw.githubusercontent.com/projectnumber135-droid/mmdrugs/refs/heads/main/images/' + sources['I'];

                // ultra-optimized thumb (300px, quality 50) + cache buster to force fresh load if image changed
                const thumbSrc = `https://images.weserv.nl/?url=${encodeURIComponent(fullSrc)}&w=300&output=webp&q=50&_t=${Date.now()}`;

                imgArea.style.display = 'block';
                imgEl.style.display = 'none';
                if (imgLoad) imgLoad.style.display = 'block';
                if (adminDelBtn) adminDelBtn.style.display = 'none';

                imgEl.dataset.fullSrc = fullSrc; // Store full resolution for later use in modal

                imgEl.onload = () => {
                    if (imgLoad) imgLoad.style.display = 'none';
                    imgEl.style.display = 'block';
                    imgEl.style.margin = '0 auto';
                    
                    // Show download button once image is loaded
                    const downloadBtn = document.getElementById('imgDownloadBtn');
                    if (downloadBtn) downloadBtn.style.display = 'block';
                    
                    if (adminDelBtn && window.isWhitelisted) {
                        adminDelBtn.style.display = 'block';
                        adminDelBtn.innerText = '🗑️';
                        adminDelBtn.disabled = false;
                    }
                };
                imgEl.onerror = () => {
                    if (imgLoad) imgLoad.style.display = 'none';
                    imgArea.style.display = 'none';
                };

                imgEl.src = thumbSrc; // Load low-res first
            } else if (imgArea) {
                imgArea.style.display = 'none';
                if (imgEl) { imgEl.src = ''; imgEl.style.display = 'none'; }
                const downloadBtn = document.getElementById('imgDownloadBtn');
                if (downloadBtn) downloadBtn.style.display = 'none';
            }

            // Populate each source content container
            populateSourcePanel('A', sources['A'], 'content-allens', 'check-allens', getSectionsFromAllens);
            populateSourcePanel('G', sources['G'], 'content-gems', 'check-gems', getSectionsFromGems);
            populateSourcePanel('B', sources['B'], 'content-boericke', 'check-boericke', getSectionsFromBoericke);

            // Show each source-box that has data, hide ones that don't
            // CSS: .source-box { display:none } by default; needs display:block + .expanded to open
            showSourceBox('box-allens', !!sources['A']);
            showSourceBox('box-gems', !!sources['G']);
            showSourceBox('box-boericke', !!sources['B']);

            // Ensure all source-boxes start collapsed
            ['allens', 'gems', 'boericke'].forEach(s => {
                const box = document.getElementById('box-' + s);
                if (box) box.classList.remove('expanded');
            });

            // Show request map area (if no image)
            const rma = document.getElementById('request-map-area');
            if (rma) {
                if (sources['I']) {
                    rma.style.display = 'none'; // hide if image exists
                } else {
                    rma.style.display = 'block';
                    // Default state
                    const btn = document.getElementById('requestBtn');
                    if (btn) {
                        btn.disabled = false;
                        btn.innerText = 'Request Mind Map';
                        btn.style.background = '#f39c12';
                        // Check if already requested in database
                        checkIfAlreadyRequested(name);
                    }
                    // Admin upload
                    const adminBtn = document.getElementById('adminUploadBtn');
                    if (adminBtn) {
                        adminBtn.style.display = window.isWhitelisted ? 'inline-block' : 'none';
                        adminBtn.innerText = '📤';
                        adminBtn.disabled = false;
                    }
                }
            }
        }

        async function checkIfAlreadyRequested(remedyName) {
            if (typeof database === 'undefined' || !remedyName) return;
            const btn = document.getElementById('requestBtn');
            if (!btn) return;

            try {
                const snapshot = await database.ref('requests').once('value');
                const data = snapshot.val();
                if (data) {
                    const normName = remedyName.trim().toUpperCase();
                    const exists = Object.values(data).some(req => req.remedyName && req.remedyName.trim().toUpperCase() === normName);
                    if (exists) {
                        btn.innerText = 'Requested!';
                        btn.style.background = '#27ae60';
                        btn.disabled = true; // prevent duplicate clicks easily
                    }
                }
            } catch (err) {
                console.error('Error checking requests:', err);
            }
        }

        function showSourceBox(boxId, show) {
            const box = document.getElementById(boxId);
            if (!box) return;
            box.style.display = show ? 'block' : 'none';
        }

        function populateSourcePanel(sourceKey, remedyNameInSource, contentId, headerCheckId, getSecFn) {
            const content = document.getElementById(contentId);
            const headerCheck = document.getElementById(headerCheckId);
            if (!content) return;

            content.innerHTML = '';
            if (headerCheck) { headerCheck.checked = false; headerCheck.indeterminate = false; }

            if (!remedyNameInSource) {
                content.innerHTML = '<p style="color:#666;font-style:italic;font-size:13px;padding:8px 12px;">Not available in this source.</p>';
                return;
            }

            const sections = getSecFn(remedyNameInSource);
            if (!sections || Object.keys(sections).length === 0) {
                content.innerHTML = `<p style="color:#666;font-style:italic;font-size:13px;padding:8px 12px;">No sections found for "${remedyNameInSource}".</p>`;
                return;
            }

            const color = SOURCE_COLORS[sourceKey];

            Object.entries(sections).forEach(([sectionKey, lines]) => {
                if (!lines || lines.length === 0) return;

                const label = document.createElement('label');
                label.className = 'section-checkbox-row';
                label.style.cssText = `
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 8px 12px;
                    cursor: pointer;
                    border-radius: 6px;
                    transition: background 0.15s;
                    margin: 2px 0;
                `;
                label.addEventListener('mouseenter', () => label.style.background = '#2e2e2e');
                label.addEventListener('mouseleave', () => label.style.background = 'transparent');

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.dataset.source = sourceKey;
                cb.dataset.section = sectionKey;
                cb.style.cssText = `width:15px;height:15px;accent-color:${color};cursor:pointer;flex-shrink:0;`;
                cb.addEventListener('change', () => syncHeaderCheckbox(contentId, headerCheckId));

                const sectionName = document.createElement('span');
                sectionName.textContent = formatSectionKey(sectionKey);
                sectionName.style.cssText = 'color:#ddd;font-size:13px;';

                label.appendChild(cb);
                label.appendChild(sectionName);
                content.appendChild(label);
            });
        }

        function syncHeaderCheckbox(contentId, headerCheckId) {
            const content = document.getElementById(contentId);
            const hc = document.getElementById(headerCheckId);
            if (!content || !hc) return;
            const all = content.querySelectorAll('input[type="checkbox"]');
            const checked = content.querySelectorAll('input[type="checkbox"]:checked');
            hc.indeterminate = checked.length > 0 && checked.length < all.length;
            hc.checked = all.length > 0 && checked.length === all.length;
        }

        // ── HTML-wired functions (called from onclick attributes in HTML) ─────────────
        function toggleSource(src) {
            const box = document.getElementById('box-' + src);
            if (box) box.classList.toggle('expanded');
        }

        function toggleAllSections(src, checked) {
            const content = document.getElementById('content-' + src);
            if (!content) return;
            content.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);
            syncHeaderCheckbox('content-' + src, 'check-' + src);
        }

        // ── Section data helpers ──────────────────────────────────────────────────────
        function formatSectionKey(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function extractLines(value) {
            if (!value) return [];
            if (typeof value === 'string') return value.trim() ? [value] : [];
            if (Array.isArray(value)) return value.flatMap(v => extractLines(v));
            if (typeof value === 'object') {
                return Object.entries(value).map(([k, v]) => {
                    const label = formatSectionKey(k);
                    const text = typeof v === 'string' ? v : (Array.isArray(v) ? v.join(' ') : '');
                    return text ? `${label}: ${text}` : null;
                }).filter(Boolean);
            }
            return [String(value)];
        }

        function getSectionsFromAllens(remedyName) {
            const r = lookupRemedy(allensBook, remedyName);
            if (!r || !r.sections) return null;
            const result = {};
            Object.entries(r.sections).forEach(([k, v]) => {
                const lines = extractLines(v);
                if (lines.length) result[k] = lines;
            });
            return result;
        }

        function getSectionsFromGems(remedyName) {
            const r = lookupRemedy(gemsBook, remedyName);
            if (!r || !r.sections) return null;
            const result = {};
            if (r.keynotes && r.keynotes.length) result['keynotes'] = r.keynotes;
            Object.entries(r.sections).forEach(([k, v]) => {
                const lines = extractLines(v);
                if (lines.length) result[k] = lines;
            });
            return result;
        }

        function getSectionsFromBoericke(remedyName) {
            const r = lookupRemedy(boerickeBook, remedyName);
            if (!r) return null;
            const result = {};
            if (r.overview) result['overview'] = [r.overview];
            if (r.sections) {
                Object.entries(r.sections).forEach(([k, v]) => {
                    const lines = extractLines(v);
                    if (lines.length) result[k] = lines;
                });
            }
            return result;
        }

        // ── Combine (called from onclick on #combineBtn) ──────────────────────────────
        function combineData() {
            const resultText = document.getElementById('resultText');
            if (!resultText) return;

            const canonicalName = document.getElementById('remedy-name')?.textContent || '';
            if (!canonicalName || canonicalName === 'SELECT A REMEDY') {
                resultText.value = 'Please select a remedy first.';
                return;
            }

            // Collect checked sections per source
            const grouped = { A: [], G: [], B: [] };
            document.querySelectorAll('#sources-container input[type="checkbox"][data-section]:checked').forEach(cb => {
                const src = cb.dataset.source;
                if (grouped[src]) grouped[src].push(cb.dataset.section);
            });

            const hasAny = Object.values(grouped).some(arr => arr.length > 0);
            if (!hasAny) {
                resultText.value = 'Please select at least one section.';
                return;
            }

            const LABELS = { A: 'ALLENS', G: 'GEMS', B: 'BOERICKE' };
            const SEP_MAIN = '═'.repeat(60);
            const SEP_SRC = '─'.repeat(50);

            let output = '';
            output += SEP_MAIN + '\n';
            output += centerText(canonicalName.toUpperCase(), 60) + '\n';
            output += SEP_MAIN + '\n\n';

            ['A', 'G', 'B'].forEach(srcKey => {
                const sectionKeys = grouped[srcKey];
                if (!sectionKeys || sectionKeys.length === 0) return;

                const srcName = currentSources[srcKey];
                let sections = null;
                if (srcKey === 'A') sections = getSectionsFromAllens(srcName);
                else if (srcKey === 'G') sections = getSectionsFromGems(srcName);
                else if (srcKey === 'B') sections = getSectionsFromBoericke(srcName);
                if (!sections) return;

                output += `◆ ${LABELS[srcKey]}\n`;
                output += SEP_SRC + '\n\n';

                sectionKeys.forEach(sectionKey => {
                    const lines = sections[sectionKey];
                    if (!lines || lines.length === 0) return;

                    const sectionTitle = formatSectionKey(sectionKey).toUpperCase();
                    output += `  ▸ ${sectionTitle}\n`;
                    output += '  ' + '·'.repeat(40) + '\n';

                    lines.forEach((line, i) => {
                        const num = String(i + 1).padStart(2, ' ');
                        // Word-wrap at ~80 chars
                        const wrapped = wrapText(`${num}. ${line}`, 76, '      ');
                        output += '    ' + wrapped + '\n';
                    });
                    output += '\n';
                });

                output += '\n';
            });

            resultText.value = output;
            resultText.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ── Text helpers ─────────────────────────────────────────────────────────────
        function centerText(text, width) {
            const pad = Math.max(0, Math.floor((width - text.length) / 2));
            return ' '.repeat(pad) + text;
        }

        function wrapText(text, maxWidth, indent) {
            const words = text.split(' ');
            let lines = [], line = '';
            words.forEach(word => {
                if ((line + word).length > maxWidth) {
                    lines.push(line.trimEnd());
                    line = indent + word + ' ';
                } else {
                    line += word + ' ';
                }
            });
            if (line.trim()) lines.push(line.trimEnd());
            return lines.join('\n    ');
        }

        async function downloadOriginalImage() {
            const imgEl = document.getElementById('remedy-image');
            const remedyName = document.getElementById('remedy-name')?.textContent || 'remedy';
            if (!imgEl || !imgEl.dataset.fullSrc) return;

            const fullUrl = imgEl.dataset.fullSrc;
            
            try {
                const response = await fetch(fullUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `${remedyName}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                console.error("Download failed:", err);
                // Fallback to just opening in new tab if blob fetch fails
                window.open(fullUrl, '_blank');
            }
        }

        // ── Admin Image Upload Logic ────────────────────────────────────────────────
        async function handleAdminImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const remedyName = document.getElementById('remedy-name')?.textContent;
            if (!remedyName || remedyName === 'SELECT A REMEDY') return;

            const uploadBtn = document.getElementById('adminUploadBtn');
            uploadBtn.disabled = true;
            uploadBtn.innerText = '⏳';

            try {
                // 1. Fetch PAT from Firestore
                const docRef = await firestore.doc('auth/admin').get();
                if (!docRef.exists) throw new Error("PAT document not found in Firestore at auth/admin/PAT.");

                const patData = docRef.data().PAT;

                // In some setups, if the doc is just a single string value rather than a complex object, it might be stored awkwardly or under a specific key.
                // We'll check if patData is simply a string first, otherwise check common keys.
                let pat = null;
                if (typeof patData === 'string') {
                    pat = patData;
                } else if (patData) {
                    // Try to extract from common key names, or if there's only one key, use that.
                    pat = patData.token || patData.PAT || patData.pat || patData.value || patData.key || patData.tokenString;
                    if (!pat && Object.keys(patData).length === 1) {
                        pat = patData[Object.keys(patData)[0]];
                    }
                }

                if (!pat) throw new Error("PAT not found in the Firestore document at auth/admin/PAT.");

                // 2. Base64 encode and rename file
                const ext = file.name.split('.').pop();
                const newFileName = `${remedyName.toUpperCase()}.${ext}`;

                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                // 3. GitHub API Upload Image - first check if exists to get SHA if needed
                const REPO_OWNER = 'projectnumber135-droid';
                const REPO_NAME = 'mmdrugs';
                const BRANCH = 'main';

                let existingSha = null;
                try {
                    const checkPath = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${newFileName}?ref=${BRANCH}`;
                    const checkResp = await fetch(checkPath, {
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (checkResp.ok) {
                        const checkInfo = await checkResp.json();
                        existingSha = checkInfo.sha;
                    }
                } catch (e) {
                    console.log("File likely doesn't exist yet, continuing...");
                }

                const imgResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${newFileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${pat}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update/Add image for ${remedyName}`,
                        content: base64Data,
                        sha: existingSha, // Required if updating existing file
                        branch: BRANCH
                    })
                });

                if (!imgResponse.ok) {
                    const errInfo = await imgResponse.json();
                    throw new Error(`Upload failed: ${errInfo.message}`);
                }
                // 4. Update image mapping directly in Firebase Realtime Database (ultra-fast, no 409 conflicts)
                uploadBtn.innerText = '💾';
                const key = remedyToKey(remedyName);
                await database.ref('images/' + key).set({
                    name: remedyName,
                    file: newFileName
                });

                // 5. Delete from requests in Firebase
                const reqSnap = await database.ref('requests').once('value');
                const reqs = reqSnap.val();
                if (reqs) {
                    for (const [key, val] of Object.entries(reqs)) {
                        if (val.remedyName && val.remedyName.toUpperCase() === remedyName.toUpperCase()) {
                            await database.ref(`requests/${key}`).remove();
                        }
                    }
                }

                // 6. Verify image is fully propagated before showing it
                uploadBtn.innerText = '🔎';
                const verifyUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/images/${newFileName}`;

                // Poll raw content URL up to 10 times to give github cache time to clear
                for (let i = 0; i < 10; i++) {
                    try {
                        const checkReq = await fetch(verifyUrl, { method: 'HEAD', cache: 'no-store' });
                        if (checkReq.ok) break;
                    } catch (e) { }
                    await new Promise(r => setTimeout(r, 2000));
                }

                // 7. UI Updates
                uploadBtn.innerText = '✅';
                document.getElementById('request-map-area').style.display = 'none';

                // Update in-memory data
                const remObj = remedyData.find(r => r.name.toUpperCase() === remedyName.toUpperCase());
                if (remObj) {
                    remObj.sources.I = newFileName;
                    selectRemedy(remObj.name, remObj.sources); // reload UI
                }

            } catch (err) {
                console.error(err);
                alert("Upload error: " + err.message);
                uploadBtn.innerText = '📤';
                uploadBtn.disabled = false;
            }

            event.target.value = ''; // Reset input
        }

        async function handleAdminImageDelete() {
            const remedyName = document.getElementById('remedy-name')?.textContent;
            if (!remedyName || remedyName === 'SELECT A REMEDY') return;

            const typedName = prompt(`Are you sure you want to delete the image for this remedy?\nType "${remedyName.toUpperCase()}" exactly to confirm:`, "");
            if (typedName === null) return; // cancelled
            if (typedName.trim() !== remedyName.toUpperCase()) {
                alert("Name did not match. Deletion cancelled.");
                return;
            }

            const delBtn = document.getElementById('adminDeleteImgBtn');
            if (!delBtn) return;
            delBtn.disabled = true;
            delBtn.innerText = '⏳';

            try {
                // 1. Fetch PAT from Firestore
                const docRef = await firestore.doc('auth/admin').get();
                if (!docRef.exists) throw new Error("PAT document not found in Firestore.");
                const patData = docRef.data().PAT;
                let pat = null;
                if (typeof patData === 'string') pat = patData;
                else if (patData) {
                    pat = patData.token || patData.PAT || patData.pat || patData.value || patData.key || patData.tokenString;
                    if (!pat && Object.keys(patData).length === 1) pat = patData[Object.keys(patData)[0]];
                }
                if (!pat) throw new Error("PAT not found in the Firestore document.");

                const REPO_OWNER = 'projectnumber135-droid';
                const REPO_NAME = 'mmdrugs';
                const BRANCH = 'main';

                // Get the current image file name from memory
                const remObj = remedyData.find(r => r.name.toUpperCase() === remedyName.toUpperCase());
                if (!remObj || !remObj.sources.I) throw new Error("Image reference not found in memory.");
                const fileName = remObj.sources.I;

                // 2. Get file SHA from GitHub to delete it
                const imgMetaResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${fileName}?ref=${BRANCH}`, {
                    headers: {
                        'Authorization': `token ${pat}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (imgMetaResponse.ok) {
                    const imgMeta = await imgMetaResponse.json();

                    // 3. Delete image file from GitHub
                    const deleteImgResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/images/${fileName}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${pat}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Delete image for ${remedyName}`,
                            sha: imgMeta.sha,
                            branch: BRANCH
                        })
                    });

                    if (!deleteImgResponse.ok) {
                        console.warn("Failed to delete image file from GitHub. It might already be gone.");
                    }
                }
                // 4. Remove image reference from Firebase Realtime Database
                const key = remedyToKey(remedyName);
                await database.ref('images/' + key).remove();

                // 7. Update UI
                delBtn.innerText = '✅';
                preloadedImages.delete(fileName); // remove from cache set
                setTimeout(() => {
                    delete remObj.sources.I;
                    selectRemedy(remObj.name, remObj.sources); // reload UI which will handle hiding the image area
                }, 1000);

            } catch (err) {
                console.error(err);
                alert("Delete error: " + err.message);
                delBtn.innerText = '🗑️';
                delBtn.disabled = false;
            }
        }

        // ── Admin Logic (Request Management) ─────────────────────────────────────────

        function copyAllRequests() {
            if (allRequestsList.length === 0) return;
            const names = allRequestsList.map(req => req.remedyName).join(', ');
            navigator.clipboard.writeText(names).then(() => {
                const btn = document.getElementById('copyAllBtn');
                const oldText = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = oldText; }, 2000);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }

        function copySingleRequest(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const oldText = btnElement.innerText;
                btnElement.innerText = 'Copied!';
                setTimeout(() => { btnElement.innerText = oldText; }, 2000);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }

        async function deleteRequest(id, remedyName) {
            if (!confirm(`Are you sure you want to delete the request for ${remedyName}?`)) return;
            try {
                const snapshot = await database.ref('requests').once('value');
                const data = snapshot.val();
                if (data) {
                    const normName = remedyName.trim().toUpperCase();
                    const updates = {};
                    Object.keys(data).forEach(key => {
                        if (data[key].remedyName && data[key].remedyName.trim().toUpperCase() === normName) {
                            updates[key] = null;
                        }
                    });
                    await database.ref('requests').update(updates);
                }
                loadAdminData(); // Refresh list without reload
            } catch (err) {
                console.error('Error deleting request:', err);
                alert('Error deleting request');
            }
        }

        async function clearAllRequests() {
            if (!confirm('Are you sure you want to clear ALL requested mind maps?')) return;
            try {
                await database.ref('requests').remove();
                loadAdminData(); // Refresh list
            } catch (err) {
                console.error('Error clearing requests:', err);
                alert('Error clearing requests');
            }
        }

        async function loadAdminData() {
            const loading = document.getElementById('admin-loading');
            const requestList = document.getElementById('requestList');
            if (!loading || !requestList) return;

            loading.style.display = 'block';
            requestList.style.display = 'none';

            try {
                const snapshot = await database.ref('requests').once('value');
                loading.style.display = 'none';
                requestList.style.display = 'flex';

                if (!snapshot.exists()) {
                    requestList.innerHTML = '<div class="no-data">No mind maps have been requested yet.</div>';
                    document.getElementById('actionBtns').style.display = 'none';
                    return;
                }

                const data = snapshot.val();
                let requestsArray = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => b.id - a.id);

                const uniqueRequests = [];
                const seenNames = new Set();
                requestsArray.forEach(req => {
                    const normName = req.remedyName ? req.remedyName.trim().toUpperCase() : "";
                    if (normName && !seenNames.has(normName)) {
                        seenNames.add(normName);
                        uniqueRequests.push(req);
                    }
                });

                allRequestsList = uniqueRequests;
                document.getElementById('actionBtns').style.display = allRequestsList.length > 0 ? 'block' : 'none';

                requestList.innerHTML = '';
                allRequestsList.forEach(req => {
                    let dateStr = "Unknown Date";
                    if (req.requestedAt) {
                        const dateObj = new Date(req.requestedAt);
                        dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `
                        <div>
                            <div class="req-remedy-name">${req.remedyName}</div>
                            <div class="request-email" style="font-size: 13px; color: var(--primary-color); margin-top: 4px;">${req.userEmail || 'Anonymous'}</div>
                            <div class="request-date">${dateStr}</div>
                        </div>
                        <div>
                            <button class="delete-btn" onclick="deleteRequest('${req.id}', '${req.remedyName.replace(/'/g, "\\'")}')">Delete</button>
                            <button class="copy-btn" style="margin-left: 10px; padding: 8px 12px; font-size: 13px; border-radius: 6px;" onclick="copySingleRequest('${req.remedyName.replace(/'/g, "\\'")}', this)">Copy</button>
                        </div>
                    `;
                    requestList.appendChild(card);
                });
            } catch (err) {
                console.error("Error fetching requests:", err);
                loading.innerText = 'Error loading requests.';
            }
        }

        // ── Routing ──────────────────────────────────────────────────────────────────

        function handleRouting() {
            const hash = window.location.hash;
            const searchView = document.getElementById('search-view');
            const requestView = document.getElementById('request-view');

            if (hash === '#request') {
                if (searchView) searchView.style.display = 'none';
                if (requestView) {
                    requestView.style.display = 'block';
                    loadAdminData();
                }
            } else {
                if (searchView) searchView.style.display = 'block';
                if (requestView) requestView.style.display = 'none';
            }
        }
