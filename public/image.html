<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostbot Pro AI | Image Studio</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mode-btn {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            background: #0f172a;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            color: white;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .upload-area {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .control-group {
            background: rgba(15, 23, 42, 0.3);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .group-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .model-rows {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .model-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-card {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .checkbox-card:hover {
            border-color: var(--accent);
        }

        .checkbox-card.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .checkbox-card input {
            display: none;
        }

        .checkbox-card small {
            opacity: 0.7;
            font-size: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 5px;
        }

        .count-selector {
            display: flex;
            gap: 8px;
        }

        .btn-toggle {
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-toggle.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        #generateBtn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
        }

        #generateBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.3);
        }

        #generateBtn:active {
            transform: translateY(0);
        }

        #generateBtn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
            width: 100%;
        }

        .img-card {
            background: #1e293b;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            border-bottom: 1px solid var(--border);
            width: 100%;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        .delete-btn svg {
            width: 14px;
            height: 14px;
        }

        .img-card:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 12px;
            vertical-align: middle;
        }

        .auth-bar {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }

        .auth-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .auth-btn:hover {
            color: white;
            border-color: var(--accent);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-bar">
        <button id="authBtn" class="auth-btn" style="display: none;"></button>
    </div>

    <div class="container">
        <!-- <h1>Ghostbot Pro AI</h1>
        <div class="subtitle">State-of-the-art visual generation & editing</div> -->

        <div class="mode-toggle" style="display: none;">
            <button class="mode-btn active" id="genMode">Text-to-Image</button>
            <button class="mode-btn" id="editMode">Image Edit</button>
        </div>

        <div class="input-section">
            <!-- Upload Area for Edits -->
            <div id="uploadContainer" class="upload-area"
                onclick="if(document.getElementById('fileUploadUI').style.display !== 'none') document.getElementById('fileInput').click()">
                <div id="fileUploadUI" style="display: flex; flex-direction: column; align-items: center;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        style="color: var(--accent); margin-bottom: 8px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span>Click to upload source image</span>
                </div>
                <div id="urlInputUI" style="display: none; width: 100%;" onclick="event.stopPropagation()">
                    <div style="font-size: 12px; margin-bottom: 8px; color: var(--text-dim);">Enter Image URL for Flux
                        Editing</div>
                    <input type="text" id="imageUrlInput" placeholder="https://api.infip.pro/generated_images/..."
                        style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; color: white; outline: none;">
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none">
                <img id="filePreview" class="preview-img">
            </div>

            <textarea id="prompt"
                placeholder="Provide a detailed description of the vision you want to generate..."></textarea>

            <div class="control-group">
                <div class="group-label">Select Engine</div>
                <div class="model-rows">
                    <div class="model-row" id="syncModels"></div>
                    <div class="model-row" id="asyncModels"></div>
                </div>
            </div>

            <div class="options-grid">
                <div>
                    <div class="group-label">Batch Size</div>
                    <div class="count-selector" id="countSelector">
                        <button class="btn-toggle active" data-value="1">1</button>
                        <button class="btn-toggle" data-value="2">2</button>
                        <button class="btn-toggle" data-value="3">3</button>
                        <button class="btn-toggle" data-value="4">4</button>
                    </div>
                </div>

                <div>
                    <div id="sizeLabel" class="group-label">Base Resolution</div>
                    <select id="size">
                        <option value="1024x1792" selected>Portrait (1024x1792)</option>
                        <option value="1024x1024">Square (1024x1024)</option>
                        <option value="1792x1024">Landscape (1792x1024)</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn">Initiate Summoning</button>
        </div>

        <div id="status">System Ready</div>
        <div id="gallery"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEGgnLQy0dfHRGlaLnpvWP0-LFsI7zM4E",
            authDomain: "mmdrugs.firebaseapp.com",
            projectId: "mmdrugs",
            storageBucket: "mmdrugs.firebasestorage.app",
            messagingSenderId: "74640700507",
            appId: "1:74640700507:web:0827c77cc8815ea9abbb7e",
            measurementId: "G-JSLWNK875Z"
        };
        firebase.initializeApp(firebaseConfig);
        const firestore = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let isAdmin = false;

        auth.onAuthStateChanged(async user => {
            const authBtn = document.getElementById('authBtn');
            authBtn.style.display = 'block';
            
            if (user) {
                authBtn.innerText = 'Logout Admin';
                authBtn.onclick = () => auth.signOut();
                
                try {
                    const emailDoc = await firestore.doc('auth/admin').get();
                    if (emailDoc.exists) {
                        const emails = emailDoc.data().email;
                        isAdmin = emails.includes(user.email.toLowerCase().trim());
                    }
                } catch (e) {
                    console.error("Admin verification error:", e);
                }
            } else {
                authBtn.innerText = 'Admin Login';
                authBtn.onclick = () => auth.signInWithPopup(provider);
                isAdmin = false;
            }
            
            // Refresh gallery to show/hide delete buttons
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(btn => btn.style.display = isAdmin ? 'flex' : 'none');
        });

        const apiKey = "infip-4f344f6b";
        const proxy = "https://corsproxy.io/?";
        const apiUrlGen = "https://api.infip.pro/v1/images/generations";
        const apiUrlEdit = "https://api.infip.pro/v1/images/edits";
        const pollBaseUrl = "https://api.infip.pro/v1/tasks/";

        const sync_models = [
            "img3", "img4", "flux-schnell", "lucid-origin", "phoenix", "sdxl", "sdxl-lite",
            "flux2-klein-9b", "flux2-klein-4b", "dreamshaper"
        ];
        const async_models = ["nano-banana", "nbpro"];
        const pro_models = ["nano-banana", "nbpro"];
        const cf_models = [
            "flux-schnell", "lucid-origin", "phoenix", "sdxl", "sdxl-lite",
            "flux2-klein-9b", "flux2-klein-4b"
        ];
        const edit_models = ["flux2-klein-9b", "flux2-klein-4b", "nbpro", "nano-banana"];

        let selectedModel = "img4";
        let selectedCount = 1;
        let isEditMode = false;

        // Elements
        const syncContainer = document.getElementById('syncModels');
        const asyncContainer = document.getElementById('asyncModels');
        const generateBtn = document.getElementById('generateBtn');
        const statusEl = document.getElementById('status');
        const galleryEl = document.getElementById('gallery');
        const promptEl = document.getElementById('prompt');
        const sizeEl = document.getElementById('size');
        const uploadArea = document.getElementById('uploadContainer');
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const sizeLabel = document.getElementById('sizeLabel');

        // Mode Switching
        document.getElementById('genMode').onclick = (e) => setMode(false, e.target);
        document.getElementById('editMode').onclick = (e) => setMode(true, e.target);

        function setMode(edit, btn) {
            isEditMode = edit;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            uploadArea.style.display = edit ? 'flex' : 'none';
            sizeLabel.innerText = edit ? "Aspect Ratio" : "Base Resolution";
            generateBtn.innerText = edit ? "Process Image Edit" : "Initiate Summoning";

            // Re-init models to show correct availability
            initModels();

            // Adjust size options if needed (doc says "square", "landscape", "portrait")
            if (edit) {
                sizeEl.innerHTML = `
                    <option value="portrait" selected>Portrait (9:16)</option>
                    <option value="square">Square (1:1)</option>
                    <option value="landscape">Landscape (16:9)</option>
                `;
            } else {
                sizeEl.innerHTML = `
                    <option value="1024x1792" selected>Portrait (1024x1792)</option>
                    <option value="1024x1024">Square (1024x1024)</option>
                    <option value="1792x1024">Landscape (1792x1024)</option>
                `;
            }
        }

        // File Selection Preview
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    filePreview.src = re.target.result;
                    filePreview.style.display = 'block';
                    uploadArea.querySelector('span').innerText = file.name;
                };
                reader.readAsDataURL(file);
            }
        };

        // Initialize Models
        function initModels() {
            syncContainer.innerHTML = '';
            asyncContainer.innerHTML = '';

            if (isEditMode) {
                if (edit_models.length === 0) {
                    syncContainer.innerHTML = `<span style="font-size:12px; color:var(--text-dim)">Image Editing is currently unavailable.</span>`;
                } else {
                    edit_models.forEach(m => {
                        const isActuallyAsync = async_models.includes(m);
                        createCheckbox(m, syncContainer, !isActuallyAsync);
                    });
                    if (!edit_models.includes(selectedModel)) selectedModel = edit_models[0];
                }
            } else {
                sync_models.forEach(m => {
                    const isActuallyAsync = async_models.includes(m);
                    createCheckbox(m, syncContainer, !isActuallyAsync);
                });
            }
            refreshSelection();
        }

        function createCheckbox(modelName, container, isSync) {
            const isPro = pro_models.includes(modelName);
            const label = document.createElement('label');
            label.className = `checkbox-card ${modelName === selectedModel ? 'active' : ''}`;
            label.innerHTML = `
                <input type="radio" name="model" value="${modelName}" ${modelName === selectedModel ? 'checked' : ''}>
                ${modelName} ${isSync ? '<small>(Sync)</small>' : '<small>(Async)</small>'}
                ${isPro ? '<span title="Pro Tier Required" style="color:#fbbf24; cursor:help; font-size:12px; margin-left:4px;">★</span>' : ''}
            `;
            label.onclick = () => {
                selectedModel = modelName;
                refreshSelection();
            };
            container.appendChild(label);
        }

        function refreshSelection() {
            document.querySelectorAll('.checkbox-card').forEach(c => {
                const radio = c.querySelector('input');
                c.classList.toggle('active', radio.value === selectedModel);
            });

            // Toggle Edit UI based on model capability
            if (isEditMode) {
                const isMultipartModel = ["nbpro", "nano-banana"].includes(selectedModel);
                document.getElementById('fileUploadUI').style.display = isMultipartModel ? 'flex' : 'none';
                document.getElementById('urlInputUI').style.display = isMultipartModel ? 'none' : 'block';
                if (!isMultipartModel) {
                    statusEl.innerHTML = `<span style="color:var(--text-dim)">Note: ${selectedModel} requires an Image URL. Paste one below.</span>`;
                }
            }

            // Enforce Batch Size 1 for CF and Async models
            const needsN1 = cf_models.includes(selectedModel) || async_models.includes(selectedModel);
            if (needsN1) {
                selectedCount = 1;
                document.querySelectorAll('.btn-toggle').forEach(b => {
                    b.classList.toggle('active', b.dataset.value === "1");
                    if (b.dataset.value !== "1") b.style.opacity = "0.5";
                });
                statusEl.innerHTML = `<span style="color:var(--text-dim)">Note: ${selectedModel} only supports Batch Size 1.</span>`;
            } else {
                document.querySelectorAll('.btn-toggle').forEach(b => {
                    b.style.opacity = "1";
                    b.classList.toggle('active', parseInt(b.dataset.value) === selectedCount);
                });
                statusEl.innerHTML = "System Ready";
            }
        }

        // Initialize Count Buttons
        document.getElementById('countSelector').onclick = (e) => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedCount = parseInt(e.target.dataset.value);
            }
        };

        // Polling logic
        async function pollTask(taskId) {
            const pollUrl = proxy + encodeURIComponent(pollBaseUrl + taskId);
            const maxAttempts = 60;
            let attempts = 0;

            statusEl.innerHTML = `<span class="loader"></span> Processing asynchronously... (Task ID: ${taskId})`;

            while (attempts < maxAttempts) {
                try {
                    const response = await fetch(pollUrl, { headers: { "Authorization": `Bearer ${apiKey}` } });
                    const result = await response.json();

                    // API returns 'data' array upon completion, status field might be missing at that point
                    if (result.data && Array.isArray(result.data)) {
                        statusEl.innerText = "Task completed successfully.";
                        renderImages(result.data);
                        return;
                    } else if (result.status === "failed") {
                        throw new Error(result.error || "Async task failed on server.");
                    } else {
                        const currentStatus = result.status || "processing";
                        statusEl.innerHTML = `<span class="loader"></span> Current Status: <strong>${currentStatus}</strong>... (Wait: ${attempts + 1}/60)`;
                        await new Promise(r => setTimeout(r, 2000));
                        attempts++;
                    }
                } catch (error) {
                    console.error("Poll Error:", error);
                    break;
                }
            }
            throw new Error("Polling timeout reached.");
        }

        function renderImages(data) {
            if (!data || data.length === 0) {
                statusEl.innerHTML = `<span style="color:var(--error)">No images returned from API.</span>`;
                return;
            }
            data.forEach(item => {
                const thumbUrl = `https://images.weserv.nl/?url=${encodeURIComponent(item.url)}&w=600&output=webp&q=75`;
                const card = document.createElement('div');
                card.className = 'img-card';
                card.innerHTML = `
                    <button class="delete-btn" title="Delete Image" style="display: ${isAdmin ? 'flex' : 'none'}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                        Delete Image
                    </button>
                    <img src="${thumbUrl}" alt="Output" onclick="window.open('${item.url}', '_blank')" onerror="this.src='${item.url}'; this.onerror=null;">
                `;
                
                // Use a direct listener instead of inline onclick for better reliability
                const delBtn = card.querySelector('.delete-btn');
                delBtn.onclick = () => card.remove();
                
                galleryEl.prepend(card);
            });
        }

        async function handleDispatch() {
            const promptValue = promptEl.value.trim();
            if (!promptValue) return alert("Please enter a description.");

            let currentApiUrl = apiUrlGen;
            let options = {};

            if (isEditMode) {
                const isMultipartModel = ["nbpro", "nano-banana"].includes(selectedModel);

                if (isMultipartModel) {
                    const imgFile = fileInput.files[0];
                    if (!imgFile) return alert("Please upload an image to edit.");
                    currentApiUrl = apiUrlEdit;
                    const fd = new FormData();
                    fd.append('image', imgFile);
                    fd.append('prompt', promptValue);
                    fd.append('model', selectedModel);
                    fd.append('n', 1);
                    fd.append('aspect_ratio', sizeEl.value);
                    fd.append('response_format', 'url');

                    options = {
                        method: 'POST',
                        headers: { "Authorization": `Bearer ${apiKey}` },
                        body: fd
                    };
                } else {
                    const imageUrl = document.getElementById('imageUrlInput').value.trim();
                    if (!imageUrl) return alert("Please paste an image URL for Flux editing.");

                    currentApiUrl = apiUrlGen;
                    options = {
                        method: 'POST',
                        headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: selectedModel,
                            prompt: promptValue,
                            n: 1,
                            size: sizeEl.value,
                            response_format: "url",
                            images: [imageUrl]
                        })
                    };
                }
            } else {
                options = {
                    method: 'POST',
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: selectedModel,
                        prompt: promptValue,
                        n: selectedCount,
                        size: sizeEl.value,
                        response_format: "url"
                    })
                };
            }

            generateBtn.disabled = true;
            statusEl.innerHTML = `<span class="loader"></span> Communicating with <b>${selectedModel}</b>...`;
            // galleryEl.innerHTML = ""; // Now keeping old images

            try {
                const response = await fetch(proxy + encodeURIComponent(currentApiUrl), options);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || `API Error (${response.status})`);
                }

                if (data.task_id) {
                    await pollTask(data.task_id);
                } else if (data.data) {
                    statusEl.innerText = "Processing Successful!";
                    renderImages(data.data);
                } else {
                    throw new Error("Unknown response format received.");
                }
            } catch (err) {
                statusEl.innerHTML = `<span style="color: var(--error)">Dispatch Failed: ${err.message}</span>`;
                console.error(err);
            } finally {
                generateBtn.disabled = false;
            }
        }

        generateBtn.onclick = handleDispatch;
        promptEl.onkeydown = (e) => { if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); handleDispatch(); } };

        initModels();
    </script>
</body>

</html>
